/* Layout: one phone-width column, red lacquer header with gold rule, cream paper body, bottom tab bar */
:root{
  --red:#8E1B1B;--red2:#6E1212;--gold:#F3C24B;--gold2:#B8862A;
  --bg:#E9E1D3;--paper:#FBF5EC;--card:#FFFFFF;--ink:#231A17;--muted:#6B5B53;--line:#EADFCB;
  --green:#2F6B3A;--green-bg:#E5F0E3;--warn:#9A5B00;--warn-bg:#FCEFD6;--bad:#A3261F;--bad-bg:#F9E1DE;
  --soft:#F6EDDF;--wall:#F3E3C7;--roof:#8E1B1B;--win:#BFD8E6;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Lora','Be Vietnam Pro',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120D0B;--paper:#1B1412;--card:#251C19;--ink:#F4EAE0;--muted:#BBA89C;--line:#3B2D28;
  --green:#7FC48A;--green-bg:#1F3123;--warn:#F0B85A;--warn-bg:#3A2B12;--bad:#F08A80;--bad-bg:#3D1C19;
  --soft:#2C221E;--wall:#5A4634;--roof:#B8312F;--win:#4D6B7A;--gold2:#E2B04A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120D0B;--paper:#1B1412;--card:#251C19;--ink:#F4EAE0;--muted:#BBA89C;--line:#3B2D28;
  --green:#7FC48A;--green-bg:#1F3123;--warn:#F0B85A;--warn-bg:#3A2B12;--bad:#F08A80;--bad-bg:#3D1C19;
  --soft:#2C221E;--wall:#5A4634;--roof:#B8312F;--win:#4D6B7A;--gold2:#E2B04A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--red);color:#fff;padding-block:12px 10px;border-bottom:4px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.kicker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
.hname{font-family:var(--f-disp);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolebtn{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.2);color:#fff;font-size:12px;font-weight:700}
.res{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 9px;display:flex;flex-direction:column;min-width:50px}
.chip span{font-size:10px;color:#F8E6D2}.chip b{font-size:14px;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:var(--red2);background:var(--gold);border:2px solid #fff;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:32px;height:32px;font-size:12px;border-width:0}
.ticker{background:var(--red2);color:var(--gold);font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;padding-block:6px}
.ticker span{display:inline-block;padding-left:100%;animation:run 22s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0;white-space:normal}}
main{flex:1;padding-block:14px 104px}

.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}

.h2{font-family:var(--f-disp);font-size:17px;font-weight:700;margin:0 0 8px;text-wrap:balance}
.h3{font-size:14px;font-weight:800;margin:0}

.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{min-height:44px;border-radius:12px;border:none;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:0 16px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:15px;color:var(--ink)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.tile .em{font-size:22px;line-height:1}
.tile b{font-size:13.5px;line-height:1.3}
.tile .sub{font-size:11.5px}
.bell{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:14px;display:grid;place-items:center;padding:0}
.bell.on{background:var(--gold);border-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.gold{background:var(--gold);color:var(--red2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

function render(){

    const tabs=TABS[a.role];
    if(QL[a.role]&&QL[a.role].some(x=>x[0]===U.tab)){U.seg.ql=U.tab;U.tab='ql'}
    if(!U.tab||!tabs.some(t=>t[0]===U.tab))U.tab=tabs[0][0];
    const ent=U._lt!==U.tab;U._lt=U.tab;$('#app').innerHTML=header(a)+tickerHtml()+`<main class="gut${ent?' enter':''}"><div class="stack">${TAB[U.tab](a)}</div></main>`+

function houseSvg(a){

function wheelSvg(v){
  const c=110,R=90,n=8;let s='';
  for(let i=0;i<n;i++){const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2,r=R*v[i]/10;
    s+=`<path d="M${c} ${c} L${c+R*Math.cos(a0)} ${c+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${c+R*Math.cos(a1)} ${c+R*Math.sin(a1)}Z" fill="var(--soft)" stroke="var(--line)"/>`;
    s+=`<path d="M${c} ${c} L${c+r*Math.cos(a0)} ${c+r*Math.sin(a0)} A${r} ${r} 0 0 1 ${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)}Z" fill="${i%2?'var(--gold2)':'var(--red)'}" opacity=".85"/>`;
    const am=(a0+a1)/2;s+=`<text x="${c+(R+14)*Math.cos(am)}" y="${c+(R+14)*Math.sin(am)+3}" font-size="8.5" text-anchor="middle" fill="var(--muted)" font-family="Be Vietnam Pro,sans-serif">${WHEEL[i].split(' ')[0]}</text>`}
  return `<svg viewBox="-10 -10 240 240" style="width:100%;max-width:260px;display:block;margin:8px auto" role="img" aria-label="Bánh xe cuộc đời">${s}</svg>`;
}

const HH={vat:.1,tncn:.1,vp:.15,ctv:.42,cg:.22,tpcg:.05,tp:.16,qp:.15,cc:.2,bh:.1,tl3:15e5,qcn:1e6,fixed:43e6,luongTL:27e6,vanhanh:6e6,luongTP:10e6,
 tiers:[[10,'Dưới 10 tỷ',[5e6,6e6,0]],[20,'10 đến 20 tỷ',[5e6,9e6,3e6]],[50,'Trên 20 đến 50 tỷ',[5e6,12e6,18e6]],[100,'Trên 50 đến 100 tỷ',[5e6,18e6,30e6]]]};
function hhGop(ty){const p=ty*1e9;return ty>=3&&ty<=3.5?1e8:p*.03}
function tierOf(ty){for(const t of HH.tiers){if(ty<10&&t[0]===10)return t;if(ty>=10&&ty<=t[0]&&t[0]!==10)return t}return null}
function vu(ty,own,H){
  H=H||hhGop(ty);const vat=H*HH.vat,tncn=(H-vat)*HH.tncn,D=H-vat-tncn;
  const vp=D*HH.vp,ctv=D*HH.ctv,cg=D*HH.cg,tpcg=D*HH.tpcg,tp=D*HH.tp;
  const qp=tp*HH.qp,cc=tp*HH.cc,bh=tp*HH.bh;
  const tk=own?tp+ctv:tp;const t=own?tierOf(ty):null;
  const thuong=own?(t?t[2]:[0,0,0]):[HH.tl3,0,0];const qcn=own?0:HH.qcn;
  const tui=tk-qp-cc-bh-thuong.reduce((s,v)=>s+v,0)-qcn;
  const ok=Math.abs(vat+tncn+vp+ctv+cg+tpcg+tp-H)<1;
  return {ty,own,H,vat,tncn,D,vp,ctv,cg,tpcg,tp,qp,cc,bh,tk,t,thuong,qcn,tui,ok,noTier:own&&!t};
}

 const HG=['Đông','Tây','Nam','Bắc','Đông Nam','Đông Bắc','Tây Nam','Tây Bắc'];

 ${mine.map(ksCard).join('')||'<p class="sub">Chưa có căn nào.</p>'}`}};

function renderSheet(){
  const w=$('#sheetwrap');
  if(!U.sheet||!S.me&&U.sheet!=='switch'){w.innerHTML='';return}
  const [sk,sa]=U.sheet.split(':');const s=SH[sk](sa);const sc=w.querySelector('.sheet');const top=sc?sc.scrollTop:0;
  w.innerHTML=`<div class="sheet-bg" data-a="closeBg"><div class="sheet gut" role="dialog" aria-modal="true" aria-label="${esc(s.t)}"><div class="grab"></div><div class="sheet-h"><h2 class="h2" style="margin:0">${esc(s.t)}</h2><button class="x" data-a="closeSheet" aria-label="Đóng">×</button></div>${s.h}</div></div>`;
  const nsc=w.querySelector('.sheet');if(nsc)nsc.scrollTop=top;
}

async function ksHeicSangJpg(file){let loi=null;
 try{const H=await ksNapJs('heicto',['heic-to.js','https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js'],'HeicTo');return await H({blob:file,type:'image/jpeg',quality:.9})}catch(e){loi=e;console.warn('heic-to',e)}

 throw new Error('Ảnh HEIC này chưa đọc được'+(loi&&loi.message?' ('+loi.message+')':'')+'. Thử chụp màn hình tấm ảnh rồi tải lên nha')}

function ksDocAnh(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const img=new Image();img.decoding='async';
 img.onload=()=>res({src:img,w:img.naturalWidth,h:img.naturalHeight,done:()=>URL.revokeObjectURL(u)});img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};img.src=u})}
async function ksGiaiMa(file){
 if(!file||!file.size)throw new Error('Hình chưa tải xong về máy (0 byte). Mở hình trong Drive, tải về máy rồi chọn lại nha');
 let head='';try{const ab=await file.slice(0,32).arrayBuffer();head=String.fromCharCode(...new Uint8Array(ab))}catch(e){}
 if(window.createImageBitmap&&!ksLaHeic(file,head)){try{const bm=await createImageBitmap(file,{imageOrientation:'from-image'});return {src:bm,w:bm.width,h:bm.height,done:()=>bm.close&&bm.close()}}catch(e){}}
 if(!ksLaHeic(file,head)){try{return await ksDocAnh(file)}catch(e){}}
 // HEIC/HEIF (ảnh iPhone, ảnh tải từ Drive/Google Photos) hoặc định dạng trình duyệt không tự đọc được
 try{return await ksDocAnh(file)}catch(e){}
 return ksDocAnh(await ksHeicSangJpg(file))}

A.aiWrite=()=>{const t=val('ain');U.aiIn=t;if(!t){toast('Dán tin vào trước nhé');return}U.aiOut=aiRewrite(t);render()};
function aiRewrite(t){
  const s=t.replace(/\s+/g,' ');
  const price=(s.match(/(\d+[.,]?\d*)\s*(tỷ|ty)/i)||[])[0];const area=(s.match(/\d+[.,]?\d*\s*[xX×]\s*\d+[.,]?\d*\s*m?/)||[])[0];
  const alley=(s.match(/hẻm\s*\d+[.,]?\d*\s*m/i)||[])[0];const pn=(s.match(/\d+\s*(PN|phòng ngủ)/i)||[])[0];
  const floors=(s.match(/\d+\s*trệt[^,.]*/i)||[])[0];const so=/sổ hồng|sổ riêng|SHR/i.test(s);
  const street=(s.match(/(đường|hẻm)?\s*([A-ZĐ][\p{L}]+(\s[A-ZĐ][\p{L}]+){1,3})/u)||[])[2];
  const L=['🏡 NHÀ ĐẸP '+(street?street.toUpperCase():'TÂN PHÚ, TÂN BÌNH')+(price?' · CHỈ '+price.toUpperCase():''),''];
  if(area)L.push('📐 Diện tích: '+area.trim());if(floors)L.push('🏢 Kết cấu: '+floors.trim());if(pn)L.push('🛏️ '+pn.trim());if(alley)L.push('🚗 '+alley.trim()+', xe hơi tới nhà');if(so)L.push('📄 Sổ hồng riêng, pháp lý rõ ràng');if(price)L.push('💰 Giá: '+price.trim()+' (có thương lượng)');
  L.push('','Nhà sạch đẹp, vào ở ngay. Liên hệ Hoa Vinh để xem nhà trong ngày nhé!','','#HoaVinh #NhaPhoTanPhu #NhaPhoTanBinh');
  return L.join('\n');
}

function shrink(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,200/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};img.onerror=()=>toast('Không đọc được ảnh này');img.src=r.result};r.readAsDataURL(file)}

function thuNhoAnh(dataUrl,maxW,maxH){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const k=Math.min(1,maxW/im.width,maxH/im.height);const w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',.85))}catch(e){res(dataUrl)}};im.onerror=()=>res(dataUrl);im.src=dataUrl})}

const SHF={};
function shDb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('hv-chia-se',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function shLuu(id,files){if(!files||!files.length)return;SHF[id]=files;
 try{const db=await shDb();const tx=db.transaction('f','readwrite');tx.objectStore('f').put(files.map(f=>({n:f.name,t:f.type,b:f})),id)}catch(e){}}
async function shLay(id){if(SHF[id])return SHF[id];
 try{const db=await shDb();const v=await new Promise(ok=>{const r=db.transaction('f').objectStore('f').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)});
  if(v&&v.length){SHF[id]=v.map(x=>new File([x.b],x.n||'anh.jpg',{type:x.t||x.b.type}));return SHF[id]}}catch(e){}return []}

function dlBody(d,offset){const f=d.f,tc=d.tc||{};const Q=dlQuanAll(tc);let district=[],province=null;
 if(f.d1){const q=Q.find(x=>String(x.id)===String(f.d1));if(q){district=[q.id];province=q.tinh}}else if(f.dm.length){district=f.dm.slice();const q=Q.find(x=>String(x.id)===String(f.dm[0]));if(q)province=q.tinh}
 let area;if(f.area){const a=(tc.area||[]).find(x=>String(x.value)===String(f.area));if(a&&a.name){const p=String(a.name).split('-');area={from:parseInt(p[0])||0,to:parseInt(p[1])||null}}}
 const p0=DL_GIA[f.pi0||0],p1=DL_GIA[f.pi1==null?DL_GIA.length-1:f.pi1];const price=(p0>0||p1<10000)?{from:Math.round(p0*1000),to:p1>=10000?null:Math.round(p1*1000)}:undefined;
 const s=(tc.sort||[])[+(f.sort||0)];const sorts=s?{[s.field]:s.value}:undefined;
 const segV=f.seg!==''&&f.seg!=null?((tc.segment||[]).find(x=>String(x.value)===String(f.seg))||{}).value:undefined;
 return {size:d.size,offset:offset||0,keyword:f.kw||'',sorts,location:{province,district,ward:f.d1?(f.wd||[]):[]},area,price,segment:segV,attribute:f.attr?(isNaN(+f.attr)?f.attr:+f.attr):undefined,approval_house_label:f.label||undefined,thong_minh:f.kw||'',huong:(f.hg||[]).slice()}}
A.dlSearch=async(more)=>{const d=dlS();if(d.loading)return;if(!dtkTok()){A.dtkLoginOpen();return}const add=more==='more';const off=add?(d.nextOff!=null?d.nextOff:d.list.length):0;if(!add){d.list=[];d.total=null;d.hieu='';d.da={};d.het=false;d.tim=dlTimGi(d.f)}d.loading=true;d.err=null;d.searched=true;d.t0=Date.now();dlDongHo(true);render();
 if(!add)setTimeout(()=>{const e=document.getElementById('dlKq');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},60);
 try{const body=dlBody(d,off);let j;try{j=await dtkApi('tim',body)}catch(e1){if(e1.status===401||!(body.location&&body.location.district&&body.location.district.length))throw e1;
   /* ĐTK chưa nhận lọc theo mã quận → tìm theo tên quận/phường */const Q=dlQuanAll(d.tc);const ten=body.location.district.map(id=>{const q=Q.find(x=>String(x.id)===String(id));return q?q.name.split(' · ')[0]:''}).filter(Boolean);
   const P=(Q.find(x=>String(x.id)===String(d.f.d1))||{}).phuong||[];const tp=(body.location.ward||[]).map(id=>(P.find(w=>String(w.id)===String(id))||{}).name).filter(Boolean);
   const b2=Object.assign({},body,{keyword:[body.keyword,tp.join(' ')||ten.join(' ')].filter(Boolean).join(' ')});delete b2.location;j=await dtkApi('tim',b2);d.theoTen=true}if(j&&j.success===false)throw new Error(j.message||'Đại Thế Kỷ chưa trả được tin');const dd=(j&&j.detail)||{};let list=dd.data||(j&&j.data)||[];if(!Array.isArray(list))list=[];
  if(!add)d.hieu=dd.hieu||'';d.list=add?d.list.concat(list):list;d.total=dd.total!=null?dd.total:(j&&j.total);d.nextOff=dd.next_offset!=null?dd.next_offset:d.list.length;d.du=dd.du;d.het=dd.het!=null?!!dd.het:(d.total!=null&&d.list.length>=d.total);d.da=add?d.da:{}}
 catch(e){if(e.status===401){dtkSetTok('');toast('Phiên Đại Thế Kỷ hết hạn, đăng nhập lại nha');A.dtkLoginOpen()}else d.err=e.message}
 d.loading=false;dlDongHo(false);render()};
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.dl;if(!k)return;const d=dlS(),f=d.f;
 if(k==='pi0'||k==='pi1'){let v=+e.target.value;if(k==='pi0'&&v>f.pi1)v=f.pi1;if(k==='pi1'&&v<f.pi0)v=f.pi0;f[k]=v}else f[k]=e.target.value;
 if(k==='kw')return;if(k==='d1'){f.wd=[];if(f.d1)f.dm=[]}if(k==='seg')dlSegGia(f,d.tc);if(k==='sort'&&d.searched){A.dlSearch();return}render()});

function dlSegGia(f,tc){const s=((tc&&tc.segment)||[]).find(x=>String(x.value)===String(f.seg));if(!s||!s.name){f.pi0=0;f.pi1=DL_GIA.length-1;return}const p=String(s.name).split('-').map(Number);f.pi0=Number.isFinite(p[0])?dlGiaIdx(p[0]/1000):0;f.pi1=Number.isFinite(p[1])&&p[1]>0?dlGiaIdx(p[1]/1000):DL_GIA.length-1}

   <div class="dlgb"><span>Từ <button data-a="dlGiaB" data-v="pi0:-1" aria-label="Giảm giá từ">−</button><button data-a="dlGiaB" data-v="pi0:1" aria-label="Tăng giá từ">+</button></span><span>Đến <button data-a="dlGiaB" data-v="pi1:-1" aria-label="Giảm giá đến">−</button><button data-a="dlGiaB" data-v="pi1:1" aria-label="Tăng giá đến">+</button></span></div></div>
  <div class="grid2"><button class="btn ghost" data-a="dlReset">Xoá lọc</button><button class="btn" style="background:#2E8B57;color:#fff" data-a="dlSearch" ${d.loading?'disabled':''}>${d.loading?'⏳ Đang tìm…':'🔍 Tìm kiếm'}</button></div>
  ${d.tcErr?`<p class="sub">Bộ lọc đang dùng bản rút gọn (${esc(d.tcErr)}).</p>`:''}</div></div>`}
function dlMs(t){if(t==null||t==='')return 0;if(typeof t==='number'||/^\d+$/.test(String(t))){const n=+t;return n<1e12?n*1000:n}const x=Date.parse(t);return isNaN(x)?0:x}
function dlAgo(t){const x=dlMs(t);if(!x)return '';const dt=new Date(x);const p=n=>String(n).padStart(2,'0');return `${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())} ${p(dt.getDate())}/${p(dt.getMonth()+1)}/${dt.getFullYear()}`}
function dlTc(kind,v){const L=((dlS().tc||{})[kind])||[];const o=L.find(x=>String(x.value)===String(v));return o?o.title:''}

function dlUser(it){const o=it.owner&&typeof it.owner==='object'?it.owner:{};const u=Object.assign({},o,it.user||{});if(!u.full_name)u.full_name=o.full_name||o.name||o.fullname||'';if(!u.avatar)u.avatar=(typeof it.avatar==='string'?it.avatar:(it.avatar&&it.avatar.url))||o.avatar||'';return u}

let dlTimer=null;function dlDongHo(on){clearInterval(dlTimer);dlTimer=null;if(!on)return;dlTimer=setInterval(()=>{const d=U.dl;const el=document.getElementById('dlTt');if(!d||!d.loading||!el){if(!d||!d.loading){clearInterval(dlTimer);dlTimer=null}return}

 el.querySelectorAll('.dltt-b li').forEach((li,i)=>{const mo=[0,2,6][i];li.className=g>=([2,6,1e9][i])?'xong':g>=mo?'dang':''})},500)}

const KHO_MAX=10;let khoMax=480;

 Promise.all(fs.slice(0,con).map(f=>ksImgResize(f,khoMax,.8).catch(err=>{console.warn('khoAnh',err);return null}))).then(L=>{const ok=L.filter(Boolean);ok.forEach(x=>DS.push(x));const hong=Math.min(fs.length,con)-ok.length;if(hong>0)toast(hong+' hình chưa đọc được, thử chụp màn hình tấm đó rồi chọn lại nha');render()})});

function dlDep(t){t=String(t||'').replace(/\\r\\n|\\n|\\r/g,'\n').replace(/\\t/g,' ').replace(/\r/g,'').trim();if(!t)return t;
 if((t.match(/\n/g)||[]).length<3){t=t.replace(/[ \t]*(?:[.;,]\s*)?(?=(?:\p{Extended_Pictographic}|[\u2600-\u27BF])\uFE0F?\s*[A-ZĐÀ-Ỹa-zđà-ỹ0-9])/gu,(m,o)=>o===0?'':'\n').replace(/\n\s*\n/g,'\n')}
 return t.replace(/^([^\n]+)\n(?!\n)/,'$1\n\n').replace(/\n{3,}/g,'\n\n')}

 const lo=c.lo||10,i=c.ti||0,con=f.length-i;if(con<=0)return '⬇️ Lưu lại '+f.length+' hình';const k=Math.min(lo,con);
 return f.length<=lo?'📥 Lưu '+f.length+' hình vào máy (bấm để mở)':(i===0?'📥 Lưu đợt 1 ('+k+'/'+f.length+' hình)':'📥 Lưu tiếp '+k+' hình (còn '+con+'/'+f.length+')')}
function dlNhanShare(c,n){if(c.shDang)return '⏳ Đang chuẩn bị '+n+' hình…';const f=c.shf;if(!f||!f.length)return '📲 Chia sẻ Zalo (bài viết + '+n+' hình)';
 const lo=c.lo||10,i=c.shi||0,con=f.length-i;if(con<=0)return '📲 Gửi lại qua Zalo';
 const k=Math.min(lo,con);if(f.length<=lo)return '📲 Gửi qua Zalo ngay ('+f.length+' hình + bài viết)';
 return i===0?'📲 Gửi qua Zalo đợt 1 ('+k+'/'+f.length+' hình + bài viết)':'📲 Gửi tiếp '+k+' hình (còn '+con+'/'+f.length+')'}

/* v53: Tạo mới mô tả. Bản thật: trạm dtk-tim-nha viec viet_lai (Gemini, góc nhìn ngẫu nhiên, tránh trùng các bản cũ) */
const DL_TIEU_DE=['{Q}: CĂN NÀY LÀM NHIỀU NGƯỜI PHẢI TÍNH LẠI CHUYỆN MUA CHUNG CƯ?','AI NÓI {Q} HẾT NHÀ ĐẸP GIÁ HỢP LÝ? XEM CĂN NÀY RỒI HÃY KẾT LUẬN','ĐẦU TƯ HAY ĐỂ Ở? CĂN NÀY Ở {Q} TRẢ LỜI ĐƯỢC CẢ HAI','HIẾM LẮM MỚI CÓ MỘT CĂN NHƯ VẦY Ở {Q}','GIA ĐÌNH TRẺ Ở {Q} ĐANG TÌM CHÍNH LÀ CĂN NÀY?'];
function dlVietLaiDemo(bai,cu){const ls=String(bai||'').split('\n');const than=ls.slice(1).join('\n');const q=(String(bai).match(/(Quận [^,\n]+|Q\.?\s?\d+|Tân Phú|Bình Tân|Gò Vấp|Tân Bình|Thủ Đức)/i)||['Sài Gòn'])[0];

 return (ds[Math.floor(Math.random()*ds.length)]||DL_TIEU_DE[0].replace('{Q}',q.toUpperCase()))+'\n'+than}

/* gửi 1 đợt hình qua bảng chia sẻ; key = 'shi' (Zalo) hoặc 'ti' (lưu máy). Trả 'xong' | 'cho' (cần bấm lại) | 'huy' */
async function dlGuiDot(c,key,text,tuDong){const f=c.shf;if((c[key]||0)>=f.length)c[key]=0;const i=c[key]||0,lo=c.lo||10;const dot=f.slice(i,i+lo);
 let d=text&&i===0?{files:dot,text}:{files:dot};try{if(!navigator.canShare(d))d={files:dot}}catch(e){d={files:dot}}
 try{await navigator.share(d)}catch(e){if(e&&e.name==='AbortError')return 'huy';if(tuDong){render();return 'cho'}
  if(lo>1&&dot.length>1){c.lo=Math.max(1,Math.floor(Math.min(lo,dot.length)/2));render();toast('Điện thoại chưa nhận '+dot.length+' hình một lúc. Bấm lại, app gửi '+c.lo+' hình mỗi đợt nhé')}
  else toast('Chưa mở được bảng chia sẻ ('+((e&&e.name)||'lỗi')+'), bấm lại nhé');return 'loi'}
 c[key]=i+dot.length;render();return c[key]<f.length?'con':'xong'}

 try{navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}
 const daCo=!!(c.shf&&c.shf.length);const f=await dlChuanBi(c);
 if(!f.length){if(navigator.share){navigator.share({text}).catch(()=>{})}else copy(text);return}
 if(!dlCoChiaSeTep(f)){f.forEach((x,k)=>setTimeout(()=>dlLuu(x,x.name),k*400));toast('Máy chưa hỗ trợ gửi nhiều hình: đã tải '+f.length+' hình về máy và chép sẵn bài viết');return}

 try{if(laIOS()&&navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e&&e.name==='AbortError')return}

function parseDtk(t){const s=String(t||'');const low=s.toLowerCase();const num=x=>parseFloat(String(x).replace(',','.'));const o={};let m;
 const ty=[...s.matchAll(/(\d+(?:[.,]\d+)?)\s*(?:tỷ|tỉ)/gi)].map(x=>num(x[1]));
 m=s.match(/(?:giảm|hạ)[^\n]*?(\d+(?:[.,]\d+)?)\s*(?:tỷ|tỉ)[^\n]*?(?:còn|xuống|→|->)\s*(\d+(?:[.,]\d+)?)\s*(?:tỷ|tỉ)/i);
 if(m){o.from=num(m[1]);o.p=num(m[2])}
 else{o.p=ty[0]||'';const g=s.match(/(?:giảm|hạ)\s*(?:chào|giá|sâu)?\s*(\d+(?:[.,]\d+)?)\s*(tỷ|tỉ|tr\b|triệu)/i);if(g&&o.p){const d=num(g[1])/(/tr/i.test(g[2])?1000:1);if(d<o.p)o.from=Math.round((o.p+d)*100)/100}}
 m=s.match(/(\d+(?:[.,]\d+)?)\s*[xX×*]\s*(\d+(?:[.,]\d+)?)\s*m?/);o.dt=m?m[1].replace('.',',')+'x'+m[2].replace('.',','):'';
 const t2=s.match(/(\d+)\s*tầng/i),l2=s.match(/(\d+)\s*lầu/i);o.tang=t2?+t2[1]:l2?+l2[1]+1:'';
 m=s.match(/(\d+)\s*(?:pn\b|phòng ngủ)/i);o.pn=m?+m[1]:'';
 m=s.match(/hướng\s*(đông nam|đông bắc|tây nam|tây bắc|đông|tây|nam|bắc)/i);o.dir=m?m[1].toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()):'';
 if(/mặt tiền|\bMT\b/.test(s)||/mặt tiền/i.test(s)){o.type='Nhà mặt tiền';o.hem='Mặt tiền'}else{m=s.match(/hẻm\s*(\d+(?:[.,]\d+)?)\s*m\b/i);o.hem=m?m[1]+'m':/hẻm\s*(xe hơi|xh\b)/i.test(s)?'xe hơi':'';o.type=/nhà nát|đất nền|bán đất/i.test(s)?'Nhà nát, đất':'Nhà phố hẻm'}
 o.q=QUAN_ALL.find(q=>low.includes(q.toLowerCase()))||'';if(!o.q){m=s.match(/(?:quận|\bq\.?)\s*(\d{1,2})\b/i);if(m)o.q='Quận '+m[1]}
 m=s.match(/https?:\/\/[^\s]+/);o.link=m?m[0]:'';
 const lines=s.split(/\n|\.\s+|;\s*/).map(x=>x.trim()).filter(Boolean);let ad='';
 for(const L of lines){if(/https?:/.test(L))continue;const k=L.match(/(\d+[\dA-Za-z]*(?:\/\d+[A-Za-z]?)*\s+[A-ZĐÀ-Ỹ][^,\n.;:()]*)/u);if(k&&!/^\d+[\d.,]*\s*(tầng|lầu|pn|phòng|tỷ|tỉ|triệu|tr\b|m2|m²|m\b|x)/i.test(k[1])){ad=k[1];break}}
 if(o.q)ad=ad.replace(new RegExp('\\s*(quận|q\\.?)?\\s*'+o.q.replace(/^Quận /,'')+'.*$','i'),'');
 o.addr=ad.replace(/\s*-\s*$/,'').slice(0,80).trim();
 m=s.match(/(?:định giá|ĐG)\s*:?\s*(\d+(?:[.,]\d+)?)\s*(?:tỷ|tỉ)/i);o.dg=m?num(m[1]):'';
 return o}

function shrinkBig(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,640/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};img.onerror=()=>toast('Không đọc được ảnh này');img.src=r.result};r.readAsDataURL(file)}

/* v44: gửi video thẳng lên YouTube (Edge Function mxh-gui-thang mở đường gửi 1 lần, chìa vẫn ở máy chủ) */
function ytTien(p,f){let el=document.getElementById('ytup');if(p<0){if(el)el.remove();window.onbeforeunload=null;return}
 if(!el){el=document.createElement('div');el.id='ytup';el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(92vw,420px);z-index:60;padding:12px 14px;border-radius:18px;background:rgba(30,20,16,.88);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);font-size:13px;line-height:1.4';
  el.innerHTML='<b>🎬 Đang gửi video lên '+(window._upTen||'YouTube')+' · <span id="ytpc">0%</span></b><div style="height:8px;border-radius:6px;background:rgba(255,255,255,.18);margin:8px 0 6px;overflow:hidden"><i id="ytbar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#F3C24B,#FF6B6B);transition:width .3s"></i></div><span style="opacity:.8">Giữ màn hình app mở cho tới khi xong nha · <span id="ytmb"></span></span>';
  document.body.appendChild(el);window.onbeforeunload=e=>{e.preventDefault();e.returnValue='';return ''}}
 const pc=Math.round(p*100),mb=f?f.size/1048576:0;const q=id=>document.getElementById(id);
 if(q('ytpc'))q('ytpc').textContent=pc+'%';if(q('ytbar'))q('ytbar').style.width=pc+'%';if(q('ytmb')&&f)q('ytmb').textContent=(mb*p).toFixed(0)+' / '+mb.toFixed(0)+' MB'}
async function ytFnLoi(error,data){let j=data;try{if((!j||!j.loi)&&error&&error.context&&error.context.json)j=await error.context.json()}catch(e){}return (j&&j.loi)||(error&&errVi(error))||''}
async function guiThangYt(bai,kenh,f,hen){let wl=null;window._upTen='YouTube';ytTien(0,f);try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
 const ty=f.type||'video/mp4';
 try{const {data,error}=await sb.functions.invoke('mxh-gui-thang',{body:{action:'mo_duong',bai_dang_id:bai,kenh_id:kenh,size:f.size,type:ty,hen:hen||null}});
  if(error||!data||!data.upload_url)throw new Error(await ytFnLoi(error,data)||'Không mở được đường gửi video');
  const res=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',data.upload_url);x.setRequestHeader('Content-Type',ty);
   x.upload.onprogress=e=>{if(e.lengthComputable)ytTien(e.loaded/e.total,f)};
   x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){ok({})}}else no(new Error('YouTube báo lỗi '+x.status))};
   x.onerror=()=>no(new Error('Mạng bị ngắt khi đang gửi video, thử lại bằng Wi-Fi nhé'));x.send(f)});
  if(!res||!res.id)throw new Error('YouTube chưa nhận video');
  ytTien(1,f);await sb.functions.invoke('mxh-gui-thang',{body:{action:'ghi',bai_dang_id:bai,kenh_id:kenh,video_id:res.id}});return true}
 catch(e){try{await sb.functions.invoke('mxh-gui-thang',{body:{action:'ghi',bai_dang_id:bai,kenh_id:kenh,loi:String(e.message||e)}})}catch(x){}toast('YouTube: '+(e.message||e));return false}
 finally{ytTien(-1);try{wl&&wl.release()}catch(e){}}}
/* v45: TikTok gửi thẳng theo từng khúc qua mxh-gui-thang */
function guiKhucTt(q,blob,tu,f){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',SB_URL+'/functions/v1/mxh-gui-thang?'+q);
 x.setRequestHeader('Authorization','Bearer '+q._tk);x.setRequestHeader('apikey',SB_KEY);x.setRequestHeader('Content-Type','application/octet-stream');
 x.upload.onprogress=e=>{if(e.lengthComputable)ytTien((tu+e.loaded*blob.size/e.total)/f.size,f)};
 x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}if(x.status>=200&&x.status<300&&j.ok)ok(j);else no(new Error(j.loi||('Lỗi '+x.status)))};
 x.onerror=()=>no(new Error('Mạng bị ngắt khi đang gửi video, thử lại bằng Wi-Fi nhé'));x.send(blob)})}
async function guiThangTt(bai,kenh,f,tt){let wl=null;window._upTen='TikTok';ytTien(0,f);try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
 const ty=f.type||'video/mp4';
 try{const {data,error}=await sb.functions.invoke('mxh-gui-thang',{body:{action:'mo_duong',bai_dang_id:bai,kenh_id:kenh,size:f.size,type:ty,tt}});
  if(error||!data||!data.upload_url)throw new Error(await ytFnLoi(error,data)||'Không mở được đường gửi video');
  const cs=data.chunk_size,n=data.so_khuc;
  for(let i=0;i<n;i++){const tu=i*cs,den=i===n-1?f.size:tu+cs;
   const {data:ss}=await sb.auth.getSession();const tk=ss&&ss.session&&ss.session.access_token;if(!tk)throw new Error('Đăng nhập lại giúp mình nhé');
   const q=new URLSearchParams({action:'tt_khuc',bai_dang_id:bai,kenh_id:kenh,tu:String(tu),tong:String(f.size),type:ty,u:data.upload_url});
   const qq=q.toString();const qs=Object.assign(new String(qq),{_tk:tk});
   let lan=0;for(;;){try{await guiKhucTt(qs,f.slice(tu,den),tu,f);break}catch(e){if(++lan>=3)throw e;await new Promise(r=>setTimeout(r,2000*lan))}}}
  ytTien(1,f);await sb.functions.invoke('mxh-gui-thang',{body:{action:'ghi',bai_dang_id:bai,kenh_id:kenh,publish_id:data.publish_id,rieng:!!data.rieng,nhap:!!data.nhap,ly_do:data.ly_do||''}});ttTheoDoi(kenh,data.publish_id);return {ok:true,rieng:!!data.rieng,nhap:!!data.nhap}}
 catch(e){try{await sb.functions.invoke('mxh-gui-thang',{body:{action:'ghi',bai_dang_id:bai,kenh_id:kenh,loi:String(e.message||e)}})}catch(x){}toast('TikTok: '+(e.message||e));return {ok:false}}
 finally{ytTien(-1);window._upTen='';try{wl&&wl.release()}catch(e){}}}

/* ---- v91 Tiện ích (bảng tien_ich, SQL ctv-gon/tien-ich-bang.sql). Video gửi thẳng từ điện thoại lên Google Drive chính
   qua Edge Function khao-sat-drive (ti_mo → đường gửi, ti_xong → mở quyền xem bằng link, ti_bo → bỏ video cũ) ---- */
LIVE.ti91={ds:[],off:false,at:0,dang:false};
async function loadTi91(){const {data,error}=await sb.from('tien_ich').select('*').order('tao_luc',{ascending:false}).limit(1000);
 if(error){if(thieuBang69(error,'tien_ich')){LIVE.ti91.off=true;LIVE.ti91.ds=[];LIVE.ti91.at=Date.now();return}throw error}
 LIVE.ti91.off=false;LIVE.ti91.ds=(data||[]).map(r=>({id:'ti'+r.id,dbId:r.id,ten:r.ten,khu:r.khu_vuc||'',ghi:r.ghi_chu||'',vid:r.drive_link||'',fid:r.drive_file_id||'',byId:r.nguoi_id,by:nguoiTen69(r.nguoi_id),
  d:String(r.tao_luc||'').slice(0,10),sua:r.cap_nhat_luc&&r.tao_luc&&Date.parse(r.cap_nhat_luc)-Date.parse(r.tao_luc)>60000?String(r.cap_nhat_luc).slice(0,10):''}));LIVE.ti91.at=Date.now()}
function ti91Nen(){if(LIVE.ti91.dang||!LIVE.me||LIVE.me.trang_thai!=='hoat_dong'||Date.now()-LIVE.ti91.at<60000)return;LIVE.ti91.dang=true;
 loadTi91().catch(e=>{LIVE.ti91.at=Date.now();console.warn('[Hoa Vinh] tien ich',e)}).finally(()=>{LIVE.ti91.dang=false;const k=String(U.sheet||'');if(k==='survey'||k.startsWith('ti91'))render()})}
ti91Ds=()=>{ti91Nen();return LIVE.ti91.ds};
ti91CuaToi=x=>!!(x&&LIVE.me&&x.byId===LIVE.me.id);
ti91Tat=()=>LIVE.ti91.off;
ti91DriveOk=()=>{const k=ksDriveKenh();return !!(k&&k.trang_thai!=='can_ket_noi_lai')};
async function ti91GuiDrive(f,ten){const ty=f.type||'video/mp4';let wl=null;window._upTen='Google Drive';ytTien(0,f);try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
 try{const {data,error}=await sb.functions.invoke('khao-sat-drive',{body:{action:'ti_mo',ten,size:f.size,type:ty}});
  if(data&&data.chua_ket_noi)throw new Error('Google Drive chính chưa kết nối. Sếp hoặc Trợ lý kết nối ở màn Khảo sát nhà nha');
  if(error||!data||!data.upload_url)throw new Error(await ytFnLoi(error,data)||'Không mở được đường gửi video lên Drive');
  const res=await new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('PUT',data.upload_url);x.setRequestHeader('Content-Type',ty);
   x.upload.onprogress=e=>{if(e.lengthComputable)ytTien(e.loaded/e.total,f)};
   x.onload=()=>{if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){ok({})}}else no(new Error('Google Drive báo lỗi '+x.status))};
   x.onerror=()=>no(new Error('Mạng bị ngắt khi đang gửi video, thử lại bằng Wi-Fi nhé'));x.send(f)});
  if(!res||!res.id)throw new Error('Google Drive chưa nhận video');ytTien(1,f);
  const {data:d2,error:e2}=await sb.functions.invoke('khao-sat-drive',{body:{action:'ti_xong',file_id:res.id}});
  if(e2||!d2||!d2.ok)throw new Error(await ytFnLoi(e2,d2)||'Video đã lên Drive nhưng chưa mở quyền xem được');
  return {fid:res.id,link:d2.link||('https://drive.google.com/file/d/'+res.id+'/view')}}
 finally{ytTien(-1);try{wl&&wl.release()}catch(e){}}}
const ti91Bo=fid=>{if(fid)sb.functions.invoke('khao-sat-drive',{body:{action:'ti_bo',file_id:fid}}).catch(()=>{})};
ti91Api.luu=async(d,x)=>{if(LIVE.busy)throw new Error('Đang lưu, chờ chút nha');
 let fid=x?x.fid:'',link=x?x.vid:'',moi='';
 if(d.mode==='file'){const r=await ti91GuiDrive(d.file,d.ten);fid=moi=r.fid;link=r.link}
 else if(d.mode==='link'){fid='';link=d.link}else if(d.mode==='bo'){fid='';link=''}
 busy(true,'Đang lưu tiện ích…');
 try{const rec={ten:d.ten,khu_vuc:d.khu||null,ghi_chu:d.ghi||null,drive_file_id:fid||null,drive_link:link||null,cap_nhat_luc:new Date().toISOString()};
  const {error}=x?await sb.from('tien_ich').update(rec).eq('id',x.dbId):await sb.from('tien_ich').insert(rec);if(error)throw error;
  if(x&&x.fid&&x.fid!==fid)ti91Bo(x.fid);await loadTi91()}
 catch(e){if(moi)ti91Bo(moi);throw new Error(errVi(e))}finally{busy(false)}};
ti91Api.xoa=async x=>{if(LIVE.busy)throw new Error('Đang xử lý, chờ chút nha');busy(true,'Đang xoá…');
 try{if(x.fid){try{await sb.functions.invoke('khao-sat-drive',{body:{action:'ti_bo',file_id:x.fid}})}catch(e){}}
  const {error}=await sb.from('tien_ich').delete().eq('id',x.dbId);if(error)throw error;await loadTi91()}catch(e){throw new Error(errVi(e))}finally{busy(false)}};


/* ---- v94 Đồng bộ xoá 2 chiều với Google Drive (Edge Function khao-sat-drive bản 13):
   • Xoá khảo sát trong app → thư mục căn đó trên Drive vào thùng rác (ks_bo). Tiện ích: đã bỏ video vào thùng rác từ v91 (ti_bo).

{const o=ksDel;ksDel=async s=>{try{await sb.functions.invoke('khao-sat-drive',{body:{action:'ks_bo',id:s.id}})}catch(e){}return o(s)}}

 sb.functions.invoke('khao-sat-drive',{body:{action:'kiem_drive'}}).then(async({data})=>{if(data&&data.doi>0){await Promise.all([loadKs().catch(()=>{}),loadTi91().catch(()=>{})]);render()}}).catch(()=>{}).finally(()=>{DRV94D=false})}
{const o=ksLamMoi;ksLamMoi=function(f){drive94Kiem();return o(f)}}
{const o=ti91Nen;ti91Nen=function(){drive94Kiem();return o()}}

render();
