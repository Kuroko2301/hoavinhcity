<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoa Vinh City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column, red lacquer header with gold rule, cream paper body, bottom tab bar */
:root{
  --red:#8E1B1B;--red2:#6E1212;--gold:#F3C24B;--gold2:#B8862A;
  --bg:#E9E1D3;--paper:#FBF5EC;--card:#FFFFFF;--ink:#231A17;--muted:#6B5B53;--line:#EADFCB;
  --green:#2F6B3A;--green-bg:#E5F0E3;--warn:#9A5B00;--warn-bg:#FCEFD6;--bad:#A3261F;--bad-bg:#F9E1DE;
  --soft:#F6EDDF;--wall:#F3E3C7;--roof:#8E1B1B;--win:#BFD8E6;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Lora','Be Vietnam Pro',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120D0B;--paper:#1B1412;--card:#251C19;--ink:#F4EAE0;--muted:#BBA89C;--line:#3B2D28;
  --green:#7FC48A;--green-bg:#1F3123;--warn:#F0B85A;--warn-bg:#3A2B12;--bad:#F08A80;--bad-bg:#3D1C19;
  --soft:#2C221E;--wall:#5A4634;--roof:#B8312F;--win:#4D6B7A;--gold2:#E2B04A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120D0B;--paper:#1B1412;--card:#251C19;--ink:#F4EAE0;--muted:#BBA89C;--line:#3B2D28;
  --green:#7FC48A;--green-bg:#1F3123;--warn:#F0B85A;--warn-bg:#3A2B12;--bad:#F08A80;--bad-bg:#3D1C19;
  --soft:#2C221E;--wall:#5A4634;--roof:#B8312F;--win:#4D6B7A;--gold2:#E2B04A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--paper);position:relative;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--red);color:#fff;padding-block:12px 10px;border-bottom:4px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.kicker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--gold);text-transform:uppercase}
.hname{font-family:var(--f-disp);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rolebtn{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.2);color:#fff;font-size:12px;font-weight:700}
.res{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:rgba(0,0,0,.22);border-radius:10px;padding:4px 9px;display:flex;flex-direction:column;min-width:50px}
.chip span{font-size:10px;color:#F8E6D2}.chip b{font-size:14px;font-variant-numeric:tabular-nums}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:var(--red2);background:var(--gold);border:2px solid #fff;overflow:hidden;font-size:14px}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:32px;height:32px;font-size:12px;border-width:0}
.ticker{background:var(--red2);color:var(--gold);font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;padding-block:6px}
.ticker span{display:inline-block;padding-left:100%;animation:run 22s linear infinite}
@keyframes run{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0;white-space:normal}}
main{flex:1;padding-block:14px 104px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
nav.tabs button{border:none;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0 2px}
nav.tabs button.on{color:var(--red);font-weight:800}
:root:not([data-theme="light"]) nav.tabs button.on{color:var(--gold2)}
nav.tabs svg{width:22px;height:22px}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.hl{border:2px solid var(--gold)}
.card.lock{opacity:.6}
.h2{font-family:var(--f-disp);font-size:17px;font-weight:700;margin:0 0 8px;text-wrap:balance}
.h3{font-size:14px;font-weight:800;margin:0}
.sub{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{min-height:44px;border-radius:12px;border:none;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:0 16px}
.btn.gold{background:var(--gold);color:var(--red2)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.sm{min-height:34px;font-size:12.5px;padding:0 12px;border-radius:10px}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.full{width:100%}
.link{background:none;border:none;color:var(--red);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
:root:not([data-theme="light"]) .link{color:var(--gold2)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.in{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:15px;color:var(--ink)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;position:relative}
.tile .em{font-size:22px;line-height:1}
.tile b{font-size:13.5px;line-height:1.3}
.tile .sub{font-size:11.5px}
.bell{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:14px;display:grid;place-items:center;padding:0}
.bell.on{background:var(--gold);border-color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green-bg);color:var(--green)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.gold{background:var(--gold);color:var(--red2)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold2);border-radius:4px}
.bar.r i{background:var(--red)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-disp);font-size:40px;font-weight:700;line-height:1}
.tet{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:none;position:relative;overflow:hidden}
.tet .sub{color:#F8E6D2}
.tet .big{color:var(--gold)}
.blossom{position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.35}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;border:none;background:none;border-radius:9px;padding:8px 10px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:none}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:13px;color:#fff}
.tick.on{background:var(--green);border-color:var(--green)}
.rw{font-size:11.5px;color:var(--gold2);font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.days span{height:34px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.days span.on{background:var(--gold);color:var(--red2)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.note.ok{background:var(--green-bg);color:var(--green)}
.otpbox{font-size:28px;letter-spacing:12px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.demo-code{border:2px dashed var(--gold2);border-radius:14px;padding:10px;text-align:center}
.demo-code b{font-size:26px;letter-spacing:6px;color:var(--red)}
:root:not([data-theme="light"]) .demo-code b{color:var(--gold)}
.auth-hero{background:var(--red);color:#fff;padding-block:34px 26px;border-bottom:4px solid var(--gold);text-align:center}
.auth-hero h1{font-family:var(--f-disp);font-size:30px;margin:6px 0 4px}
.auth-hero p{margin:0;color:#F8E6D2;font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,8,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:460px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;z-index:30;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:6px 0 10px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.tl .ev b{display:block;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--muted);font-weight:700;border-top:none}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{font-weight:800}
.stackbar{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:8px 0}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
.stepper b{min-width:34px;text-align:center;font-size:20px}
.secret{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700}
.vid{background:#1d1513;border-radius:14px;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.vid .play{width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--red2);border:none;font-size:22px}
.vid .vbar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold)}
.vid .vt{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:700;color:#F8E6D2}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;margin-top:8px;font-size:13.5px}
.opt.on{border:2px solid var(--red);background:var(--soft)}
.opt.right{border:2px solid var(--green);background:var(--green-bg)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-bg)}
.house{display:block;width:100%;max-width:300px;margin:0 auto}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700}
.picks button.on{background:var(--red);border-color:var(--red);color:#fff}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.roleopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px}
.roleopt.on{border:2px solid var(--gold2)}
.muted{color:var(--muted)}
.lockscreen{text-align:center;padding:10px 0}
.lockscreen .big{color:var(--bad)}
hr.s{border:none;border-top:1px solid var(--line);margin:4px 0}
.city{background:var(--soft);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.city svg{display:block;width:100%;height:auto}
.city g[data-a]{cursor:pointer}
.city g[data-a]:hover{filter:brightness(1.1)}
.lbl{font-size:8.5px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;font-family:var(--f-body)}
.bldbtn{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;font-weight:700;font-size:12.5px;min-height:44px}
.quote{font-family:var(--f-disp);font-size:16px;line-height:1.45;font-style:italic;margin:6px 0 10px}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop .tile{min-height:0;align-items:flex-start}
.c3wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#DDEBF2}
.c3{height:380px;touch-action:pan-y}
.c3 canvas{display:block;width:100%;height:100%}
.c3ui{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.c3ui button{width:40px;height:40px;border-radius:12px;border:1px solid #EADFCB;background:#fff;color:#231A17;font-size:18px;font-weight:800;padding:0}
.v3{height:280px;touch-action:pan-y;display:grid;place-items:center}
.v3 canvas{display:block;width:100%;height:100%}
.c3load{display:grid;place-items:center;height:100%;color:#6B5B53;font-weight:700;padding:16px;text-align:center}
/* v9 polish */
.card{box-shadow:0 1px 2px rgba(35,26,23,.04),0 8px 22px -12px rgba(35,26,23,.18)}
header.top{background:linear-gradient(135deg,#9E2222 0%,var(--red) 45%,var(--red2) 100%)}
.btn{transition:transform .12s ease,filter .2s,box-shadow .2s}
.btn:not(:disabled):active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,#F8D46E,var(--gold));box-shadow:0 2px 0 #C99A2E}
.tile{transition:transform .15s ease,box-shadow .2s}
.tile:active{transform:scale(.98)}
nav.tabs{backdrop-filter:saturate(1.4) blur(10px)}
nav.tabs button{position:relative}
nav.tabs button.on::before{content:"";position:absolute;top:6px;left:50%;width:42px;height:30px;transform:translateX(-50%);border-radius:15px;background:var(--soft);z-index:-1}
nav.tabs button.on svg{transform:translateY(-1px)}
.pill.gold{background:linear-gradient(110deg,var(--gold) 35%,#FFF0B8 50%,var(--gold) 65%);background-size:250% 100%;animation:shine 3.2s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.enter .stack>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
main.enter .stack>*:nth-child(2){animation-delay:.04s}main.enter .stack>*:nth-child(3){animation-delay:.08s}main.enter .stack>*:nth-child(4){animation-delay:.12s}main.enter .stack>*:nth-child(5){animation-delay:.16s}main.enter .stack>*:nth-child(n+6){animation-delay:.2s}
.board{background:radial-gradient(120% 90% at 100% 0%,#B8312F 0%,var(--red) 45%,var(--red2) 100%);border:none;color:#fff;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:-40% -10% auto auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(243,194,75,.35),transparent 70%);pointer-events:none}
.board-hd{display:flex;gap:10px;align-items:center}
.board-ic{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.14);animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-12deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.wins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:relative;z-index:1}
.win{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.18);color:#fff;border-radius:14px;padding:10px;min-height:44px;transition:transform .15s,background .2s}
.win.on{background:#FFF8EA;color:var(--ink);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.win:active{transform:scale(.97)}
.win-em{font-size:20px}.win-t{font-size:11px;font-weight:800;letter-spacing:.3px;opacity:.9}
.win-p{display:flex;align-items:center;gap:6px;min-width:0}.win-p b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-p .av{width:24px;height:24px;font-size:10px;border:1.5px solid var(--gold)}
.win-v{font-size:12px;font-weight:800;color:var(--gold)}.win.on .win-v{color:var(--red)}
.medal{width:28px;text-align:center;font-size:18px;font-weight:800;color:var(--muted);flex-shrink:0}
.li.top .bar i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.li.me{background:var(--soft);border-radius:12px;padding-inline:8px;margin-inline:-8px}
.track{position:relative;margin:0 8px}
.track-bar{height:12px;border-radius:6px;background:linear-gradient(90deg,#B07A4A22,#7B5CF033);overflow:hidden}
.track-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#B07A4A,#9AA4AE,#E0A82E,#6FB3C9,#7B5CF0);background-size:calc(100% * 100 / var(--w,100)) 100%}

function houseSvg(a){
  const lv=Math.min(a.g.lv,7);const fl=a.g.flag&&a.g.flag.status==='ok'?a.g.flag:null;
  const W=200,ground=150;let s='';
  if(lv===1){
    s+=`<rect x="45" y="105" width="110" height="45" fill="var(--wall)" stroke="var(--ink)" stroke-width="1.5"/><path d="M35 107 L100 72 L165 107Z" fill="var(--roof)"/><rect x="90" y="120" width="20" height="30" fill="var(--gold2)"/><rect x="58" y="117" width="20" height="16" fill="var(--win)"/><rect x="122" y="117" width="20" height="16" fill="var(--win)"/>`;
    var topY=72;
  }else{
    const floors=Math.min(lv,6),fh=Math.max(16,Math.min(26,92/floors)),w=lv>=7?120:84,x=(W-w)/2;
    for(let i=0;i<floors;i++){const y=ground-(i+1)*fh;s+=`<rect x="${x}" y="${y}" width="${w}" height="${fh}" fill="var(--wall)" stroke="var(--ink)" stroke-width="1.2"/>`;
      if(i===0)s+=`<rect x="${W/2-9}" y="${y+fh*0.25}" width="18" height="${fh*0.75}" fill="var(--gold2)"/>`;
      else{const n=lv>=7?4:3;for(let j=0;j<n;j++){s+=`<rect x="${x+8+j*((w-16)/n)}" y="${y+4}" width="${(w-16)/n-6}" height="${fh-9}" fill="var(--win)"/>`}}}
    var topY=ground-floors*fh;
    s+=`<rect x="${x-6}" y="${topY-6}" width="${w+12}" height="6" fill="var(--roof)"/>`;
    if(lv>=5)s+=`<circle cx="${x-14}" cy="${ground-14}" r="12" fill="#C2408A" opacity=".85"/><circle cx="${x+w+14}" cy="${ground-12}" r="10" fill="#C2408A" opacity=".75"/>`;
    topY=topY-6;
  }
  if(fl)s+=`<line x1="100" y1="${topY}" x2="100" y2="${topY-30}" stroke="var(--ink)" stroke-width="2"/><rect x="100" y="${topY-30}" width="${Math.max(36,fl.text.length*6+10)}" height="16" fill="${esc(fl.color)}"/><text x="104" y="${topY-18.5}" font-size="9" font-weight="700" fill="#fff" font-family="Be Vietnam Pro, sans-serif">${esc(fl.text)}</text>`;

  if(inv.includes('denlong'))s+=`<line x1="174" y1="${ground-60}" x2="174" y2="${ground-48}" stroke="var(--ink)"/><ellipse cx="174" cy="${ground-40}" rx="8" ry="10" fill="#C0392B"/><rect x="171" y="${ground-31}" width="6" height="4" fill="#F3C24B"/>`;
  return `<svg class="house" viewBox="0 0 ${W} 165" role="img" aria-label="${houseName(lv)}"><rect x="0" y="${ground}" width="${W}" height="15" fill="var(--soft)"/>${s}</svg>`;
}

function wheelSvg(v){
  const c=110,R=90,n=8;let s='';
  for(let i=0;i<n;i++){const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2,r=R*v[i]/10;
    s+=`<path d="M${c} ${c} L${c+R*Math.cos(a0)} ${c+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${c+R*Math.cos(a1)} ${c+R*Math.sin(a1)}Z" fill="var(--soft)" stroke="var(--line)"/>`;
    s+=`<path d="M${c} ${c} L${c+r*Math.cos(a0)} ${c+r*Math.sin(a0)} A${r} ${r} 0 0 1 ${c+r*Math.cos(a1)} ${c+r*Math.sin(a1)}Z" fill="${i%2?'var(--gold2)':'var(--red)'}" opacity=".85"/>`;
    const am=(a0+a1)/2;s+=`<text x="${c+(R+14)*Math.cos(am)}" y="${c+(R+14)*Math.sin(am)+3}" font-size="8.5" text-anchor="middle" fill="var(--muted)" font-family="Be Vietnam Pro,sans-serif">${WHEEL[i].split(' ')[0]}</text>`}
  return `<svg viewBox="-10 -10 240 240" style="width:100%;max-width:260px;display:block;margin:8px auto" role="img" aria-label="Bánh xe cuộc đời">${s}</svg>`;
}

 tiers:[[10,'Dưới 10 tỷ',[5e6,6e6,0]],[20,'10 đến 20 tỷ',[5e6,9e6,3e6]],[50,'Trên 20 đến 50 tỷ',[5e6,12e6,18e6]],[100,'Trên 50 đến 100 tỷ',[5e6,18e6,30e6]]]};
function hhGop(ty){const p=ty*1e9;return ty>=3&&ty<=3.5?1e8:p*.03}
function tierOf(ty){for(const t of HH.tiers){if(ty<10&&t[0]===10)return t;if(ty>=10&&ty<=t[0]&&t[0]!==10)return t}return null}
function vu(ty,own,H){
  H=H||hhGop(ty);const vat=H*HH.vat,tncn=(H-vat)*HH.tncn,D=H-vat-tncn;
  const vp=D*HH.vp,ctv=D*HH.ctv,cg=D*HH.cg,tpcg=D*HH.tpcg,tp=D*HH.tp;
  const qp=tp*HH.qp,cc=tp*HH.cc,bh=tp*HH.bh;
  const tk=own?tp+ctv:tp;const t=own?tierOf(ty):null;
  const thuong=own?(t?t[2]:[0,0,0]):[HH.tl3,0,0];const qcn=own?0:HH.qcn;
  const tui=tk-qp-cc-bh-thuong.reduce((s,v)=>s+v,0)-qcn;
  const ok=Math.abs(vat+tncn+vp+ctv+cg+tpcg+tp-H)<1;
  return {ty,own,H,vat,tncn,D,vp,ctv,cg,tpcg,tp,qp,cc,bh,tk,t,thuong,qcn,tui,ok,noTier:own&&!t};
}
function hoaVon(per){return per>0?Math.ceil(HH.fixed/per):null}
function thang(list){const tui=list.reduce((s,v)=>s+v.tui,0),loi=tui-HH.fixed;return {tui,loi,ok:loi>=0,tp:loi+HH.luongTP}}

   ${beT?`<div class="note" style="margin-top:8px">${tr(HH.fixed)} ÷ ${tr(team.tui)} mỗi vụ team, làm tròn lên là <b>${beT} vụ</b>. ${beO?`Trưởng phòng tự bán 1 vụ ${nf(c.pOwn)} tỷ về túi ${tr(own.tui)}, nên chỉ cần <b>${beO} vụ</b>.`:''}</div>`:'<div class="note">Vụ team ở giá này không bù được chi phí.</div>'}</div>

    ${row('VAT 10%',tr(sel.vat))}${row('TNCN 10% (trên phần sau VAT)',tr(sel.tncn))}${row('Còn lại sau thuế',tr(sel.D),'tot')}

  (a.g.log||[]).forEach(l=>{if(l.d>=s0&&l.d<e0){let any=false;['bac','vang','kc'].forEach(k=>{if(l.o[k]){r[k]+=l.o[k];any=true}});if(any)r.n++}});['bac','vang','kc'].forEach(k=>r[k]=Math.round(r[k]*10)/10);return r}

function quadAt(i,j,w,d,e){return [P(i+e,j+e),P(i+w-e,j+e),P(i+w-e,j+d-e),P(i+e,j+d-e)]}

 S.accts.forEach(x=>(x.g.camp||[]).forEach(c=>{const p=parseFloat(String(c.price||'').replace(',','.'));if(p)items.push({addr:c.addr,area:/tân bình/i.test(c.addr)?'Tân Bình':'Tân Phú',type:'Cổng trại · '+x.name,p,dt:c.note||''})}));
 const L=items.filter(h=>(f.area==='all'||h.area===f.area)&&(f.seg<0||tierIdx(h.p)===f.seg)).sort((x,y)=>x.p-y.p);
 const me_=me();return {t:'Phòng lọc hàng',h:`<div class="stack">${hasCtv(me_)?`<button class="btn gold full" data-a="sheet" data-v="lochang">🔎 Đăng ký lọc hàng theo yêu cầu (còn ${3-lhUsed(me_)}/3 lượt)</button>`:''}<div class="picks">${[['all','Tất cả'],['Tân Phú','Tân Phú'],['Tân Bình','Tân Bình']].map(([k,l])=>`<button class="${f.area===k?'on':''}" data-a="loc" data-v="area:${k}">${l}</button>`).join('')}</div>
 <div class="picks"><button class="${f.seg<0?'on':''}" data-a="loc" data-v="seg:-1">Mọi tầm giá</button>${TIERS.map((t,i)=>`<button class="${f.seg===i?'on':''}" data-a="loc" data-v="seg:${i}">${t[1]}</button>`).join('')}</div>
 <div class="sub">${L.length} căn phù hợp</div>${L.map(h=>`<div class="li"><div class="grow"><b>${esc(h.addr)}</b>${h.ex?' <span class="pill">Ví dụ</span>':''}<div class="sub">${esc(h.area)} · ${esc(h.type)}${h.dt?' · '+esc(h.dt):''}</div></div><div style="text-align:right"><b class="num">${ty(h.p*1e9)}</b><div class="rw">chốt +${tierT(h.p)} 💎</div></div></div>`).join('')||'<p class="sub">Không có căn nào.</p>'}</div>`}};
SHB.nhatho=()=>relRoom('nhatho');SHB.chua=()=>relRoom('chua');SHB.hoahao=()=>relRoom('hoahao');SHB.hoigiao=()=>relRoom('hoigiao');
SHB.chuong=()=>({t:'Chuông Nhà Thờ',h:`<div class="card tet"><div class="kicker">Nhắc mỗi ngày</div><div class="big num" style="margin-top:6px">6:00</div><div class="sub" style="margin-top:6px">Mỗi sáng từ 6 giờ, lần đầu anh em mở app, chuông sẽ rung để nhắc việc hôm nay, số tuần còn lại tới Tết và một câu động lực.</div></div><button class="btn gold full" style="margin-top:10px" data-a="sheet" data-v="bell">Rung chuông thử</button>`});
SHB.tieplua=()=>{const a=me();return {t:'Trạm tiếp lửa',h:`<p class="sub">Nơi anh em tâm sự, động viên nhau. Có thể giấu tên.</p><div class="card stack" style="margin-top:8px"><textarea class="in" id="fx" placeholder="Hôm nay bạn thấy thế nào?"></textarea><label class="row sub"><input type="checkbox" id="fan"> Giấu tên khi đăng</label><button class="btn full" data-a="firePost">Gửi tâm sự</button></div>
 ${S.fire.map((f,i)=>`<div class="card" style="margin-top:10px"><div class="between"><b>${f.name?esc(f.name):'🙈 Ẩn danh'}</b><span class="sub">${fmtD(f.d)}</span></div><p style="margin:6px 0;line-height:1.5">${esc(f.text)}</p>
 ${f.rep.map(r=>`<div class="sub" style="padding:4px 0 4px 10px;border-left:3px solid var(--gold)"><b>${esc(r.n)}:</b> ${esc(r.t)}</div>`).join('')}
 <div class="row wrap" style="margin-top:8px"><button class="btn ghost sm" data-a="fireHeart" data-v="${i}">🔥 Tiếp lửa · ${f.hearts}</button>${['Cố lên!','Có anh em đây','Mai đi khảo sát cùng nhé'].map(q=>`<button class="btn ghost sm" data-a="fireQuick" data-v="${i}|${q}">${q}</button>`).join('')}</div></div>`).join('')}`}};
SHB.sieuthi=()=>{const a=me();const inv=a.g.inv||[];return {t:'Siêu thị Hoa Vinh',h:`<p class="sub">Dùng Bạc, Vàng, Kim cương mua đồ theo ý thích. Bạn đang có ${a.g.bac||0} 🥈 · ${nf(a.g.vang||0)} 🥇 · ${nf(a.g.kc||0)} 💎</p>
 <div class="shop" style="margin-top:10px">${SHOP.map(it=>{const has=!it.give&&inv.includes(it.k);const ok=Object.entries(it.price).every(([k,v])=>(a.g[k]||0)>=v);return `<div class="tile"><span class="em">${it.em}</span><b>${it.n}</b><span class="sub">${priceTxt(it.price)}</span><button class="btn ${has?'ghost':'gold'} sm" data-a="buy" data-v="${it.k}" ${has||!ok?'disabled':''} style="margin-top:auto">${has?'Đã có':ok?'Mua':'Chưa đủ'}</button></div>`}).join('')}</div>`}};
SHB.bando=()=>{const a=me();const L=[];S.accts.forEach(x=>x.g.surveys.forEach((sv,i)=>{if(sv.shared!==false)L.push(Object.assign({who:x.name},sv))}));S.pins.forEach(p=>L.push(p));
 const hs=t=>{let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;return h};
 const pins=L.map((p,n)=>{const h=hs(p.addr);const tb=/tân bình/i.test(p.addr);return {n:n+1,x:(tb?175:15)+h%130,y:28+(h>>5)%140,p}});
 return {t:'Phòng bản đồ Hoa Vinh',h:`<div class="city"><svg viewBox="0 0 320 190" role="img" aria-label="Bản đồ khảo sát của phòng"><rect width="320" height="190" fill="#EFE6D4"/><path d="M0 60 H320 M0 130 H320 M70 0 V190 M240 0 V190" stroke="#fff" stroke-width="7"/><path d="M160 0 V190" stroke="#B8862A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="80" y="18" class="lbl" text-anchor="middle">TÂN PHÚ</text><text x="240" y="18" class="lbl" text-anchor="middle">TÂN BÌNH</text>${pins.map(q=>`<g><path d="M${q.x} ${q.y} c-7 -9 -7 -17 0 -17 c7 0 7 8 0 17z" fill="#8E1B1B"/><text x="${q.x}" y="${q.y-8}" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">${q.n}</text></g>`).join('')}</svg></div>
 <p class="sub">Bản đồ minh hoạ. Bản thật ghim đúng vị trí trên Google Maps.</p>${pins.map(q=>`<div class="li"><span class="pill gold num">${q.n}</span><div class="grow"><b>${esc(q.p.addr)}</b><div class="sub">${esc(q.p.who)} khảo sát${q.p.alley?' · hẻm '+esc(q.p.alley)+'m':''} · hướng ${esc(q.p.dir||'?')}</div><a class="link" style="font-size:12px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.p.addr)}" target="_blank" rel="noopener">Mở Google Maps</a></div></div>`).join('')}
 <button class="btn full" style="margin-top:10px" data-a="sheet" data-v="survey">Khảo sát căn mới và chia sẻ lên bản đồ</button>`}};
SH.bld=k=>SHB[k]();
SH.bell=()=>{const a=me();const t0=new Date();t0.setHours(0,0,0,0);const days=Math.round((TET-t0)/864e5);const done=a.g.tasks[today()]||[];
 return {t:'🔔 Chuông 6 giờ sáng',h:`<div class="card tet"><div class="kicker">Chào buổi sáng</div><div class="h2" style="color:#fff;margin:6px 0">${esc(a.name)} ơi, ngày mới tới rồi!</div><div class="sub">Còn ${Math.floor(days/7)} tuần nữa là Tết. “${quote()}”</div></div>
 ${a.role==='hv'?`<p style="margin-top:12px">Bước tiếp theo trong lộ trình: <b>${(hvSteps(a).find(s=>!s[1])||['Bạn đã xong cả lộ trình'])[0]}</b></p>`:''}${bellGoals(a)}
 <button class="btn gold full" style="margin-top:12px" data-a="closeSheet">Bắt đầu ngày mới</button>`}};
/* v16: Mục tiêu cá nhân trong Chuông 6 giờ sáng (mọi vai trò) */
function bellGoals(a){const G_=a.g.goals||[];const open=G_.map((g,gi)=>[g,gi]).filter(([g])=>!g.steps.length||g.steps.some(x=>!x.done));const doneN=G_.length-open.length;
 const form=`<div class="card stack" style="gap:8px;margin-top:8px"><b>${G_.length?'Thêm mục tiêu mới':'Bạn chưa đặt mục tiêu nào'}</b><input class="in" id="gt" placeholder="Ví dụ: Chốt 2 căn trong tháng 11"><textarea class="in" id="gs" rows="3" placeholder="Chia nhỏ thành từng bước, mỗi dòng một bước&#10;Ví dụ: Đăng 3 tin mỗi ngày&#10;Dẫn 5 khách mỗi tuần"></textarea><button class="btn full" data-a="addGoal">Lưu mục tiêu</button></div>`;
 return `<div class="between" style="margin:12px 0 4px"><h3 class="h3" style="margin:0">🎯 Mục tiêu cá nhân</h3>${doneN?`<span class="pill ok">Đã xong ${doneN}</span>`:''}</div>
 ${open.length?open.slice(0,3).map(([g,gi])=>{const d=g.steps.filter(x=>x.done).length,n=g.steps.length;return `<div class="card" style="margin-top:8px"><div class="between"><b>${esc(g.t)}</b>${n?`<span class="pill">${d}/${n}</span>`:''}</div>${n?`<div class="bar" style="margin:8px 0 2px"><i style="width:${d/n*100}%"></i></div>${g.steps.map((x,si)=>`<button class="task" style="width:100%;text-align:left;background:none;border:none;padding-inline:0" data-a="step" data-v="${gi}:${si}"><span class="tick ${x.done?'on':''}">${x.done?'✓':''}</span><div class="grow" style="font-weight:600;${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.t)}</div></button>`).join('')}`:''}</div>`}).join('')+(open.length>3?`<p class="sub" style="margin-top:6px">Còn ${open.length-3} mục tiêu khác trong Nhật ký.</p>`:''):''}
 ${open.length&&!U.bellAdd?`<button class="link" style="margin-top:8px" data-a="bellAdd">+ Thêm mục tiêu</button>`:form}
 <p class="sub" style="margin-top:6px">Bấm vào từng bước để đánh dấu đã làm. Hoàn thành cả mục tiêu sẽ được ghi vào Nhìn lại chặng đường.</p>`}
SH.bday=()=>{const a=me();const got=a.g.bday===today();return {t:'🎂 Chúc mừng sinh nhật',h:`<div class="card tet" style="text-align:center"><div class="big">🎂</div><div class="h2" style="color:#fff;margin:8px 0 4px">Sinh nhật vui vẻ, ${esc(a.name)}!</div><div class="sub">Cả phòng Hoa Vinh chúc bạn tuổi mới thật khoẻ, chốt thật nhiều căn.</div></div>
 <div class="card" style="margin-top:10px"><b>Quà sinh nhật: nguyên liệu xây nhà</b><div class="sub" style="margin-top:4px">20 🧱 gạch · 12 🪵 gỗ · 6 🔩 thép · 4 🪟 kính</div><button class="btn gold full" style="margin-top:10px" data-a="bdayGet" ${got?'disabled':''}>${got?'Đã nhận quà':'Nhận quà'}</button></div>`}};
SH.dealreport=()=>({t:'Báo vụ chốt',h:`<p class="sub">Báo vụ chốt để Trợ lý xét duyệt. Duyệt xong bạn nhận Kim cương theo hệ số T.</p>${tierTable()}<div class="stack" style="margin-top:10px"><input class="in" id="drh" placeholder="Căn nào, ví dụ: Nhà 4x16 Tân Sơn Nhì"><input class="in num" id="drp" type="number" step="0.1" placeholder="Giá bán (tỷ)"><button class="btn full" data-a="dealReport">Gửi xét duyệt</button></div>`});

/* ========== Sheets ========== */

SH.switch=()=>{const m=me();return {t:'Đổi vai để thử (demo)',h:`<p class="sub">Bản thật mỗi người chỉ có một vai trò. Ở đây chọn nhanh để thử từng màn hình.</p><div class="stack" style="margin-top:10px">${S.accts.map(a=>`<button class="roleopt ${m&&m.email===a.email?'on':''}" data-a="switchTo" data-v="${esc(a.email)}">${avatar(a,'sm')}<span class="grow"><b>${esc(a.name)}</b><br><span class="sub">${a.status==='pending'?'Chờ duyệt':ROLES[a.role]}</span></span>${m&&m.email===a.email?'<span class="pill ok">Đang dùng</span>':''}</button>`).join('')}</div>
 <div class="grid2" style="margin-top:12px"><button class="btn ghost" data-a="logout">Đăng xuất</button><button class="btn ghost" data-a="resetAsk">Làm mới demo</button></div>${U.resetAsk?`<div class="note" style="margin-top:10px">Xoá mọi thứ đã thử và quay về dữ liệu mẫu? <div class="row" style="margin-top:8px"><button class="btn sm" data-a="reset">Làm mới</button><button class="btn ghost sm" data-a="resetCancel">Thôi</button></div></div>`:''}`}};
SH.journey=()=>{const a=me();const g=a.g;return {t:'Nhìn lại chặng đường',h:`<div class="stats"><div class="stat"><b>${daysSince(a.joined)}</b><span>ngày cùng Hoa Vinh</span></div><div class="stat"><b>${g.lv}</b><span>cấp nhà</span></div><div class="stat"><b>${g.streak}</b><span>ngày điểm danh</span></div><div class="stat"><b>${g.clients.length}</b><span>khách đã dẫn</span></div><div class="stat"><b>${g.posts.length+g.camp.length}</b><span>tin đã đăng</span></div><div class="stat"><b>${g.deals.length}</b><span>vụ chốt</span></div></div>
 <h3 class="h3" style="margin:16px 0 8px">Nhìn lại theo từng tuần</h3>${[0,1,2,3].map(off=>{const w=weekStats(a,off);const ev=g.journey.filter(e=>e.d>=w.s&&e.d<=w.e);return `<div class="card" style="margin-top:8px"><div class="between"><b>${off===0?'Tuần này':off===1?'Tuần trước':off+' tuần trước'}</b><span class="sub">${fmtD(w.s)} – ${fmtD(w.e)}</span></div><div class="row wrap" style="margin-top:6px;gap:6px"><span class="pill">+${nf(w.bac)} 🥈</span><span class="pill">+${nf(w.vang)} 🥇</span><span class="pill">+${nf(w.kc)} 💎</span><span class="pill">${w.n} lần nhận thưởng</span></div>${ev.map(e=>`<div class="sub" style="margin-top:4px">• ${esc(e.t)}</div>`).join('')}</div>`}).join('')}<h3 class="h3" style="margin:16px 0 8px">Các cột mốc</h3><div class="tl">${g.journey.slice().reverse().map(e=>`<div class="ev"><span class="sub">${fmtD(e.d)}</span><b>${esc(e.t)}</b><span class="sub">${esc(e.s||'')}</span></div>`).join('')}</div><p class="sub">Gia nhập ngày ${fmtD(a.joined)}. Mỗi cột mốc mới (lên cấp nhà, vụ chốt, được duyệt cờ...) tự thêm vào đây.</p>`}};
SH.clients=()=>{const a=me();return {t:'Hồ sơ dẫn khách',h:`<div class="stack"><div class="grid2"><input class="in" id="kn" placeholder="Tên khách"><input class="in" id="kp" placeholder="Số điện thoại (không bắt buộc)" inputmode="tel"></div><textarea class="in" id="kq" placeholder="Yêu cầu của khách: khu vực, tầm giá, diện tích..."></textarea><div class="grid3"><select class="in" id="kqq"><option value="">Khu vực</option>${QUAN.map(q=>`<option>${q}</option>`).join('')}</select><input class="in num" id="kq1" inputmode="decimal" placeholder="Từ (tỷ)"><input class="in num" id="kq2" inputmode="decimal" placeholder="Đến (tỷ)"></div><div class="grid2"><input class="in" id="kd" type="date" value="${today()}"><input class="in" id="kt" type="time" value="15:00"></div><label class="row sub"><input type="checkbox" id="kr" checked> Nhắc tôi trước giờ dẫn khách</label><button class="btn full" data-a="addClient">Lưu lịch dẫn khách</button><p class="sub">Lịch dẫn khách tự gửi tới Trợ lý.</p></div>
 <h3 class="h3" style="margin:14px 0 4px">Lịch đã lưu</h3>${a.g.clients.map((c,i)=>`<div class="li" style="flex-wrap:wrap"><span class="pill gold num">${esc(c.time)}</span><div class="grow"><b>${esc(c.name)}</b> <span class="sub">${esc(c.phone||'')}</span><div class="sub">${fmtD(c.date)} · ${esc(c.need)}${c.photos?' · đã gửi '+c.photos+' hình':''}</div></div><label class="btn ghost sm" for="cph${i}" style="display:inline-flex;align-items:center">📷 Gửi hình +1 Vàng</label><input type="file" id="cph${i}" accept="image/*" hidden data-file="clientPhoto" data-idx="${i}"></div>`).reverse().join('')}<p class="sub" style="margin-top:6px">Mỗi hình dẫn khách được 1 Vàng. Che mặt khách vẫn được tính.</p>`}};
SH.survey=()=>{const a=me();return {t:'Khảo sát nhà',h:`<div class="stack"><label class="f" for="sa">Địa chỉ<input class="in" id="sa" placeholder="Số nhà, tên đường, phường"></label><div class="grid2"><label class="f" for="sw2">Hẻm trước nhà (m)<input class="in num" id="sw2" type="number" step="0.5" placeholder="5"></label><label class="f" for="sd">Hướng nhà<select class="in" id="sd">${['Đông','Tây','Nam','Bắc','Đông Nam','Đông Bắc','Tây Nam','Tây Bắc'].map(x=>`<option>${x}</option>`).join('')}</select></label></div>
 <label class="f" for="ss">Ảnh sổ (không bắt buộc)<input class="in" id="ss" type="file" accept="image/*"></label><textarea class="in" id="sn" placeholder="Ghi chú: hiện trạng, nội thất, giá chủ chào..."></textarea><button class="btn full" data-a="addSurvey">Lưu khảo sát</button></div>
 <h3 class="h3" style="margin:14px 0 4px">Đã khảo sát</h3>${a.g.surveys.slice().reverse().map(s=>`<div class="li"><div class="grow"><b>${esc(s.addr)}</b><div class="sub">Hẻm ${esc(s.alley||'?')}m · hướng ${esc(s.dir)}${s.so?' · có sổ':''}</div><a class="link" style="font-size:12px" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.addr)}" target="_blank" rel="noopener">Mở Google Maps</a> <button class="link" style="font-size:12px;margin-left:10px" data-a="copySurvey" data-v="${esc(s.addr)}|${esc(s.alley)}|${esc(s.dir)}">Chép để chia sẻ</button></div></div>`).join('')||'<p class="sub">Chưa có căn nào.</p>'}`}};
SH.ai=()=>({t:'Soạn tin AI',h:`<div class="stack"><label class="f" for="ain">Dán tin copy từ Đại Thế Kỷ<textarea class="in" id="ain" placeholder="Bán nhà hẻm 6m Lũy Bán Bích, DT 4x16, 1 trệt 2 lầu, 3PN, sổ hồng riêng, giá 6.5 tỷ...">${esc(U.aiIn||'')}</textarea></label><button class="btn full" data-a="aiWrite">Soạn lại cho hay</button>${U.aiOut?`<label class="f" for="aout">Tin đã soạn<textarea class="in" id="aout" style="min-height:200px">${esc(U.aiOut)}</textarea></label><div class="grid2"><button class="btn ghost" data-a="aiCopy">Chép tin</button><button class="btn gold" data-a="aiPost">Đem đi đăng</button></div>`:''}<div class="note">Bản demo soạn theo mẫu có sẵn. Bản thật dùng AI để viết đúng giọng Hoa Vinh.</div></div>`});
SH.qa=()=>{const a=me();const kb=QA_SEED.concat(a.g.qa);return {t:'Hỏi đáp nhanh',h:`<div class="stack"><div class="row"><input class="in grow" id="qq" placeholder="Hỏi nhanh, ví dụ: hẻm xe hơi là bao nhiêu mét?" value="${esc(U.qq||'')}"><button class="btn sm" data-a="ask">Hỏi</button></div>
 ${U.qres!==undefined?(U.qres?`<div class="note ok"><b>${esc(U.qres.q)}</b><br>${esc(U.qres.a)}</div>`:`<div class="note">Chưa biết câu này. Dạy AI bên dưới nhé.</div>`):''}

function aiRewrite(t){
  const s=t.replace(/\s+/g,' ');
  const price=(s.match(/(\d+[.,]?\d*)\s*(tỷ|ty)/i)||[])[0];const area=(s.match(/\d+[.,]?\d*\s*[xX×]\s*\d+[.,]?\d*\s*m?/)||[])[0];
  const alley=(s.match(/hẻm\s*\d+[.,]?\d*\s*m/i)||[])[0];const pn=(s.match(/\d+\s*(PN|phòng ngủ)/i)||[])[0];
  const floors=(s.match(/\d+\s*trệt[^,.]*/i)||[])[0];const so=/sổ hồng|sổ riêng|SHR/i.test(s);
  const street=(s.match(/(đường|hẻm)?\s*([A-ZĐ][\p{L}]+(\s[A-ZĐ][\p{L}]+){1,3})/u)||[])[2];
  const L=['🏡 NHÀ ĐẸP '+(street?street.toUpperCase():'TÂN PHÚ, TÂN BÌNH')+(price?' · CHỈ '+price.toUpperCase():''),''];
  if(area)L.push('📐 Diện tích: '+area.trim());if(floors)L.push('🏢 Kết cấu: '+floors.trim());if(pn)L.push('🛏️ '+pn.trim());if(alley)L.push('🚗 '+alley.trim()+', xe hơi tới nhà');if(so)L.push('📄 Sổ hồng riêng, pháp lý rõ ràng');if(price)L.push('💰 Giá: '+price.trim()+' (có thương lượng)');
  L.push('','Nhà sạch đẹp, vào ở ngay. Liên hệ Hoa Vinh để xem nhà trong ngày nhé!','','#HoaVinh #NhaPhoTanPhu #NhaPhoTanBinh');
  return L.join('\n');
}

 if(r.to.startsWith('m:')){const m=S.members.find(x=>x.name===r.to.slice(2));name=m.name;role=m.role}else{const x=acct(r.to);name=x.name;role=x.role;x.g[r.k]=Math.round(((x.g[r.k]||0)+r.q)*10)/10;journey(x,'Được Trợ lý thưởng',nf(r.q)+' '+L[2]+' · '+r.why)}
 S.tlAwards=S.tlAwards||[];S.tlAwards.push({id:'tla'+Date.now(),from:a.name,fromEmail:a.email,to:name,toEmail:r.to,role,k:r.k,q:r.q,why:r.why,at:new Date().toISOString(),seen:false});

/* ========== Events ========== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(el.dataset.a==='closeBg'&&e.target!==el)return;const f=A[el.dataset.a];if(!f)return;if(el.tagName!=='INPUT')e.preventDefault();f(el.dataset.v,el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.i==='wheel'){const o=document.getElementById('whv'+el.dataset.v);if(o)o.textContent=el.value}
  if(el.dataset.i==='calc'){const v=parseFloat(String(el.value).replace(/\s/g,'').replace(',','.'));if(!isNaN(v)&&v>0){S.calc[el.dataset.v]=v;save();const box=document.getElementById('vhres');if(box)box.innerHTML=vhRes()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='otp')A.checkOtp();if(e.key==='Enter'&&e.target.id==='em')A.sendOtp();if(e.key==='Escape'&&U.sheet){U.sheet=null;render()}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.file||!el.files||!el.files[0])return;shrink(el.files[0],src=>{
  if(el.dataset.file==='regAvatar'){U.auth.draft.name=val('rn');U.auth.draft.dob=val('rd');U.auth.draft.avatar=src;render()}
  if(el.dataset.file==='clientPhoto'){const a=me();const c=a.g.clients[+el.dataset.idx];c.photos=(c.photos||0)+1;give(a,{vang:1},'Hình dẫn khách');save();render()}
  if(el.dataset.file==='selfie'){const a=me();a.g.selfie={src,status:'wait'};save();render();toast('Đã gửi ảnh selfie chờ duyệt')}})});
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,200/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};img.onerror=()=>toast('Không đọc được ảnh này');img.src=r.result};r.readAsDataURL(file)}

function tankSVG(g){

function dtkTok(){try{return sessionStorage.getItem('hoavinh-dtk-token')||''}catch(e){return ''}}

async function dtkFetch(path,body){const h={'Content-Type':'application/json'};const tk=dtkTok();if(tk)h['Authorization']='Bearer '+tk;
 const r=await fetch(DTKAPI.base+path,{method:'POST',headers:h,body:JSON.stringify(body||{})});let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error((j&&(j.message||j.error))||('Lỗi máy chủ ĐTK ('+r.status+')'));e.status=r.status;throw e}return j}

/* --- Nhắc cọc: hạn bồi cọc & ngày công chứng --- */
function dDiff(s){if(!s)return null;return Math.round((new Date(s)-new Date(today()))/864e5)}
function cocNhac(c){if(!c.coc)return '';const b=dDiff(c.coc.boi),cc=dDiff(c.coc.cc);const pill=(n,l)=>n==null?'':`<span class="pill ${n<0?'bad':n<=3?'warn':''}">${l}: ${n<0?'quá '+(-n)+' ngày':n===0?'hôm nay':'còn '+n+' ngày'}</span>`;
 const h=[pill(b,'Bồi cọc'),pill(cc,'Công chứng')].filter(Boolean).join('');return h?`<div class="row wrap" style="gap:6px;margin-top:8px">${h}</div>`:''}

/* --- Thương lượng --- */
function aiVinvilla(gc,gk){const g=gc&&gk?Math.round((gc-gk)*1000):0;const tips=[];
 if(!gc||!gk)tips.push('Nhập giá chủ đang muốn và giá khách sẵn trả để Vinvilla gợi ý cách kéo gần hai bên.');
 else if(g<=0)tips.push('Khách trả bằng hoặc cao hơn giá chủ — chốt nhanh, giữ thiện chí, nhắc khách xuống cọc sớm kẻo chủ đổi ý.');
 else{tips.push('Khoảng cách còn '+g+' triệu. Đừng ép một bên; tìm điểm chung ở giữa.');
  tips.push(g<=200?'Khoảng cách nhỏ: đề xuất chia đôi phần chênh, hoặc xin chủ tặng nội thất/phí sang tên để khách thấy có lợi.':'Khoảng cách lớn: đưa số liệu 2–3 căn vừa giao dịch quanh khu để khách thấy giá hợp lý, đồng thời hỏi chủ lý do cần bán để tìm đòn bẩy.');
  tips.push('Chốt một mức "nếu đạt thì cọc ngay hôm nay" cho cả hai bên, tránh thương lượng dây dưa.');}
 tips.push('Luôn minh bạch pháp lý, không hứa điều mình không chắc. Khó quá thì bấm "Tham vấn Trưởng phòng".');
 return tips}

 c.tl=c.tl||{};const hs=housesFor(c);const h0=hs[0];const gc=c.tl.giaChu||(h0?h0.p:'');const gk=c.tl.giaKhach||'';

   <label class="f" for="tnote">Ghi chú thương lượng<textarea class="in" id="tnote" style="min-height:70px" placeholder="VD: chủ kẹt tiền cuối năm, khách cần vào ở trước Tết…">${esc(c.tl.note||'')}</textarea></label>

A.logout=async()=>{try{await syncNow();if(sb)await sb.auth.signOut()}catch(e){}LIVE.me=null;S.accts=[];S.locks={};LIVE.hs=null;_logout()};
A.liveRefresh=async()=>{if(LIVE.busy)return;busy(true,'Đang tải lại…');
 try{await syncNow();await afterLogin(false);const m=me();toast(m&&m.status==='pending'?'Trợ lý chưa duyệt, đợi chút nha':'Đã cập nhật dữ liệu mới nhất')}
 catch(err){toast(errVi(err))}finally{busy(false);U.sheet=null;render()}};

/* ---- duyệt người mới (Trợ lý, Sếp) ---- */
QL.sep.unshift(['duyet','Duyệt']);
A.approve=async v=>{const p=acct(v);if(!p||LIVE.busy)return;const role=val('pr_'+v),gr=val('pg_'+v);busy(true,'Đang duyệt…');
 try{const {error}=await sb.rpc('duyet_nguoi_dung',{p_id:p.id,p_vai_tro:A2R[role],p_vai_tro_game:gr});if(error)throw error;
  p.role=role;p.status='active';p.g.gameRole=gr;p.g.journey.push({d:today(),t:'Được duyệt vào Hoa Vinh',s:ROLES[p.role]+' · '+gr});
  if(role==='hv')p.g.hv={tt:false,vh:false,vid:[0,0,0],test:null,meet:null};
  await syncNow();toast('Đã duyệt '+p.name+' làm '+ROLES[role])}
 catch(err){toast(/Trợ lý không|Chỉ Sếp|ít nhất 1 Sếp/.test(err.message||'')?err.message:errVi(err))}finally{busy(false);render()}};
A.reject=async v=>{const p=acct(v);if(!p||LIVE.busy)return;busy(true);
 try{const {error}=await sb.rpc('tu_choi_nguoi_dung',{p_id:p.id,p_trang_thai:'tu_choi'});if(error)throw error;S.accts=S.accts.filter(a=>a.email!==v);toast('Đã từ chối đăng ký')}
 catch(err){toast(errVi(err))}finally{busy(false);render()}};
A.unlockFor=async v=>{if(LIVE.busy)return;busy(true);
 try{const {error}=await sb.rpc('mo_khoa_dang_nhap',{p_gmail:v});if(error)throw error;delete S.locks[v];toast('Đã mở khoá cho '+v)}
 catch(err){toast(errVi(err))}finally{busy(false);render()}};

/* ---- đổi vai trò người đang hoạt động (Sếp, Trợ lý) ---- */
A.doiVai=async v=>{const i=v.indexOf('|');const email=v.slice(0,i),role=v.slice(i+1);const p=acct(email);if(!p||LIVE.busy)return;
 if(p.role===role){U.sheet=null;render();return}busy(true,'Đang đổi vai trò…');
 try{const {error}=await sb.rpc('doi_vai_tro',{p_id:p.id,p_vai_tro:A2R[role]});if(error)throw error;
  p.role=role;if(role==='hv'&&!p.g.hv)p.g.hv={tt:false,vh:false,vid:[0,0,0],test:null,meet:null};
  await syncNow();toast('Đã đổi '+p.name+' thành '+ROLES[role])}
 catch(err){toast(/Chỉ Sếp|Chỉ Trưởng phòng|Trợ lý không|ít nhất 1|không có quyền|không hợp lệ/.test(err.message||'')?err.message:errVi(err))}finally{busy(false);U.sheet=null;render()}};

/* ---- Link Drive cá nhân: lưu lên cột link_drive của chính mình ---- */
A.saveMyDrive=async()=>{const el=document.getElementById('mydrive');const v=(el?el.value:'').trim();if(v&&!isDrive(v)){toast('Link phải là link Google Drive hoặc Google Docs');return}const m=me();if(!m||!m.id||LIVE.busy)return;busy(true,'Đang lưu link Drive…');
 try{const {error}=await sb.from('nguoi_dung').update({link_drive:v}).eq('id',m.id);if(error)throw error;m.drive=v;toast(v?'Đã lưu link Drive của bạn':'Đã xoá link Drive')}
 catch(err){toast(errVi(err))}finally{busy(false);render()}};

/* ---- Hồ sơ nhân sự: chỉ đọc/ghi trên Supabase, không lưu trên máy ---- */
try{localStorage.removeItem(HS_KEY)}catch(e){}
hsLoad=function(){return LIVE.hs&&LIVE.hs.length?{rows:LIVE.hs,file:'Supabase',at:''}:null};
hsData=function(){const x=hsLoad();return x?{rows:x.rows,real:true,file:'Supabase',at:''}:{rows:[],real:false}};
async function hsUpload(rows){if(!hsCan()){toast('Chỉ Sếp và Trợ lý được nhập hồ sơ');return}busy(true,'Đang đưa '+rows.length+' hồ sơ lên…');
 try{const recs=rows.map(r=>({so_ho_so:r.so,ngay_ky_hd:r.ky,ho_ten:r.ten,ngay_sinh:r.sinh,que_quan:r.que,dia_chi:r.dc,cccd:r.cccd,so_dien_thoai:r.sdt,ma_so_thue:r.mst,so_tai_khoan:r.stk,ngan_hang:r.nh,link_drive:r.drive}));
  const d=await sb.from('ho_so_nhan_su').delete().gt('id',0);if(d.error)throw d.error;
  const {error}=await sb.from('ho_so_nhan_su').insert(recs);if(error)throw error;
  LIVE.hs=rows;U.hsOpen=null;toast('Đã lưu '+rows.length+' hồ sơ, chỉ Sếp và Trợ lý xem được')}
 catch(err){toast(errVi(err))}finally{busy(false);render()}}
A.hsClear=async()=>{if(!U.hsDelAsk){U.hsDelAsk=true;toast('Bấm “Xoá hết hồ sơ” lần nữa để xoá thật');setTimeout(()=>{U.hsDelAsk=false},6000);return}
 U.hsDelAsk=false;busy(true);try{const {error}=await sb.from('ho_so_nhan_su').delete().gt('id',0);if(error)throw error;LIVE.hs=[];U.hsOpen=null;toast('Đã xoá hồ sơ trên máy chủ')}
 catch(err){toast(errVi(err))}finally{busy(false);render()}};

/* ---- bảng Tài khoản (thay cho Đổi vai demo) ---- */
SH.switch=()=>{const m=me();if(!m)return {t:'Tài khoản',h:''};return {t:'Tài khoản của bạn',h:`<div class="row">${avatar(m)}<div class="grow"><b>${esc(m.name)}</b><div class="sub">${m.role?ROLES[m.role]+' · ':''}${esc(m.email)}</div></div></div>
 <div class="note ok" style="margin-top:12px">Bản thật đã nối máy chủ: tài khoản, vai trò, game xây nhà và hồ sơ nhân sự được lưu trên Supabase, đổi máy vẫn còn.</div>
 <div class="note" style="margin-top:8px">Đã nối thêm: báo vụ chốt, Trợ lý duyệt, bảng hệ số T năm có danh hiệu, Top 10 tháng, Trợ lý gửi thưởng. Đang nối dần: kho nhà, khách, bảng Vận hành, bài đăng, kỷ niệm… hiện vẫn là dữ liệu mẫu trên máy này.</div>
 <div class="grid2" style="margin-top:12px"><button class="btn ghost" data-a="liveRefresh">Tải lại dữ liệu</button><button class="btn ghost" data-a="logout">Đăng xuất</button></div>`}};

/* ---- khởi động ---- */
if(!S.live){S.accts=[];S.members=[];S.locks={};S.me=null;S.live=1;_save()}
if(!S.me)S.accts=[];
(async()=>{
 if(!sb){U.auth.err='Chưa tải được bộ kết nối Supabase. Kiểm tra mạng rồi tải lại trang nhé.';render();return}
 try{const {data:{session}}=await sb.auth.getSession();if(session)await afterLogin(false);else{S.me=null;S.accts=[];_save()}}
 catch(err){console.warn(err)}
 render();
 sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.me){S.me=null;S.accts=[];render()}});
})();
/* ===================== HẾT PHẦN NỐI SUPABASE ===================== */

render();
})();

</script>
